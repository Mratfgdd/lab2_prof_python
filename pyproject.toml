[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-data-processor"
version = "0.2.0"
description = "Laboratory work 2 (Professional Python): student performance data processing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nazar Levandivskyi" }]

[project.scripts]
student-report = "data_processor.main:main"
student-benchmark = "data_processor.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"report/*" = ["E402", "E501"]
